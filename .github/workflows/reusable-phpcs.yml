##
# Reusable workflow: PHP coding standards (PHPCS + WordPress Coding Standards).
#
# Modeled on WordPress core's reusable-coding-standards-php.yml.
#
# - Uses the repository's own phpcs config (.phpcs.xml, phpcs.xml, .phpcs.xml.dist,
#   phpcs.xml.dist) in `working-directory`; falls back to the MDG standard in
#   standards/phpcs/MDG of this repository.
# - Uses the repository's own PHPCS if its composer.json requires it; otherwise
#   installs WPCS 3 and PHPCompatibilityWP.
# - The MDG standard is always registered, so a project config can use <rule ref="MDG"/>.
# - By default only files changed by the pull request are checked.
# - By default violations are reported as warning annotations on the changed
#   lines and never fail the build (`fail-on-error: true` to enforce).
##
name: PHP coding standards

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory to lint, relative to the repository root (e.g. wp-content/themes/my-theme).'
        type: string
        default: '.'
      php-version:
        description: 'PHP version to run PHPCS with.'
        type: string
        default: '8.3'
      scope:
        description: "'changed' checks only files changed by the pull request; 'all' checks everything."
        type: string
        default: 'changed'
      exclude-paths:
        description: 'Regex of paths (relative to working-directory) to skip. Defaults to third-party plugins in a whole-site repo; set to an empty string to check them.'
        type: string
        default: '^wp-content/plugins/'
      fail-on-error:
        description: 'Fail the job on PHPCS errors. By default all violations are reported as warnings only.'
        type: boolean
        default: false
      standards-ref:
        description: 'Ref of matchboxdesigngroup/.github to load the MDG standard and helper scripts from. Keep in step with the ref this workflow is called at.'
        type: string
        default: 'v1'

permissions: {}

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (without file contents) so changed files can be diffed.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          show-progress: false

      - name: Checkout MDG standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matchboxdesigngroup/.github
          ref: ${{ inputs.standards-ref }}
          path: .mdg-standards
          persist-credentials: false
          show-progress: false

      - name: Move MDG standards out of the workspace
        working-directory: .
        run: mv .mdg-standards "${RUNNER_TEMP}/mdg-standards"

      - name: List files to check
        id: files
        env:
          SCOPE: ${{ inputs.scope }}
          EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          list="${RUNNER_TEMP}/phpcs-files.txt"
          bash "${RUNNER_TEMP}/mdg-standards/scripts/changed-files.sh" 'php' "$SCOPE" "$EXCLUDE_PATHS" > "$list"
          count="$(grep -c . "$list" || true)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          if [[ "$count" == "0" ]]; then
            echo "::notice title=PHPCS::No PHP files to check."
          else
            echo "Checking ${count} PHP file(s)."
          fi

      - name: Set up PHP
        if: steps.files.outputs.count != '0'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer, cs2pr

      - name: Install PHPCS
        id: install
        if: steps.files.outputs.count != '0'
        run: |
          uses_project_phpcs=false
          if [[ -f composer.json ]] && jq -e '((.require // {}) + (.["require-dev"] // {})) | has("squizlabs/php_codesniffer") or has("wp-coding-standards/wpcs")' composer.json > /dev/null; then
            uses_project_phpcs=true
          fi

          if [[ "$uses_project_phpcs" == "true" ]]; then
            echo "Using the project's PHPCS from composer.json."
            composer install --no-interaction --no-progress --prefer-dist
            phpcs="${PWD}/vendor/bin/phpcs"
          else
            echo "Installing WordPress Coding Standards."
            tools="${RUNNER_TEMP}/phpcs-tools"
            mkdir -p "$tools"
            echo '{}' > "${tools}/composer.json"
            composer --working-dir="$tools" config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
            composer --working-dir="$tools" require --no-interaction --no-progress \
              'wp-coding-standards/wpcs:^3.1' \
              'phpcompatibility/phpcompatibility-wp:^2.1'
            phpcs="${tools}/vendor/bin/phpcs"
          fi

          # Register the MDG standard alongside whatever standards are installed.
          current="$("$phpcs" --config-show | sed -n 's/^installed_paths: *//p')"
          "$phpcs" --config-set installed_paths "${current:+${current},}${RUNNER_TEMP}/mdg-standards/standards/phpcs"
          "$phpcs" -i

          echo "phpcs=${phpcs}" >> "$GITHUB_OUTPUT"

      - name: Run PHPCS
        id: phpcs
        if: steps.files.outputs.count != '0'
        env:
          PHPCS: ${{ steps.install.outputs.phpcs }}
          FILE_LIST: ${{ steps.files.outputs.list }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        run: |
          args=(
            --report-full
            "--report-checkstyle=${RUNNER_TEMP}/phpcs-report.xml"
            "--basepath=${GITHUB_WORKSPACE}"
          )

          if [[ -f .phpcs.xml || -f phpcs.xml || -f .phpcs.xml.dist || -f phpcs.xml.dist ]]; then
            echo "Using the project's phpcs config."
          else
            echo "No phpcs config found; using the MDG standard."
            args+=(--standard=MDG)
          fi

          # Warnings never fail the job; errors only when fail-on-error is set.
          args+=(--runtime-set ignore_warnings_on_exit 1)
          if [[ "$FAIL_ON_ERROR" != "true" ]]; then
            args+=(--runtime-set ignore_errors_on_exit 1)
          fi

          files=()
          while IFS= read -r file; do files+=("$file"); done < "$FILE_LIST"
          "$PHPCS" "${args[@]}" "${files[@]}"

      - name: Annotate PHPCS results
        if: ${{ always() && (steps.phpcs.outcome == 'success' || steps.phpcs.outcome == 'failure') }}
        env:
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        run: |
          if [[ "$FAIL_ON_ERROR" == "true" ]]; then
            cs2pr --graceful-warnings "${RUNNER_TEMP}/phpcs-report.xml"
          else
            cs2pr --graceful-warnings --errors-as-warnings "${RUNNER_TEMP}/phpcs-report.xml"
          fi
