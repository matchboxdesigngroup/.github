# Lints this repository with the same reusable workflows it provides to the org.
# Unlike other repos, failures here do fail the build: these files are what every repo loads.
name: Lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    uses: ./.github/workflows/reusable-markdownlint.yml
    with:
      scope: all
      fail-on-error: true
      # Test the standards and scripts in this pull request, not the released v1.
      standards-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  workflows:
    name: Workflows
    uses: ./.github/workflows/reusable-workflow-lint.yml
    with:
      fail-on-error: true
