##
# Reusable workflow: Markdown lint with David Anson's markdownlint-cli2.
#
# - Uses the repository's own markdownlint config if it has one; falls back to
#   standards/markdownlint/.markdownlint-cli2.jsonc in this repository.
# - By default only Markdown files changed by the pull request are checked.
# - By default issues are reported but never fail the build (`fail-on-error: true` to enforce).
##
name: Markdown lint

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory to lint, relative to the repository root.'
        type: string
        default: '.'
      scope:
        description: "'changed' checks only files changed by the pull request; 'all' checks everything."
        type: string
        default: 'changed'
      fail-on-error:
        description: 'Fail the job on markdownlint issues. By default they are reported only.'
        type: boolean
        default: false
      standards-ref:
        description: 'Ref of matchboxdesigngroup/.github to load the default config and helper scripts from. Keep in step with the ref this workflow is called at.'
        type: string
        default: 'v1'

permissions: {}

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          show-progress: false

      - name: Checkout MDG standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matchboxdesigngroup/.github
          ref: ${{ inputs.standards-ref }}
          path: .mdg-standards
          persist-credentials: false
          show-progress: false

      - name: Move MDG standards out of the workspace
        run: mv .mdg-standards "${RUNNER_TEMP}/mdg-standards"

      - name: List files and pick config
        id: files
        working-directory: ${{ inputs.working-directory }}
        env:
          SCOPE: ${{ inputs.scope }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Paths relative to the repository root, which is where the action runs.
          prefix=""
          if [[ "$WORKING_DIRECTORY" != "." ]]; then
            prefix="${WORKING_DIRECTORY%/}/"
          fi
          # Third-party plugins in a whole-site repo; the default config ignores the rest.
          files="$(bash "${RUNNER_TEMP}/mdg-standards/scripts/changed-files.sh" 'md|markdown' "$SCOPE" '^wp-content/plugins/' | sed "s|^|${prefix}|")"
          count="$(printf '%s' "$files" | grep -c . || true)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            echo "globs<<MDG_EOF"
            printf '%s\n' "$files"
            echo "MDG_EOF"
          } >> "$GITHUB_OUTPUT"

          config=""
          has_config=false
          for name in .markdownlint-cli2.jsonc .markdownlint-cli2.yaml .markdownlint-cli2.cjs .markdownlint-cli2.mjs \
                      .markdownlint.jsonc .markdownlint.json .markdownlint.yaml .markdownlint.yml .markdownlint.cjs .markdownlint.mjs; do
            if [[ -f "$name" || -f "${GITHUB_WORKSPACE}/${name}" ]]; then
              has_config=true
            fi
          done
          if [[ "$has_config" == "true" ]]; then
            echo "Using the project's markdownlint config."
          else
            echo "No markdownlint config found; using the MDG default."
            config="${RUNNER_TEMP}/mdg-standards/standards/markdownlint/.markdownlint-cli2.jsonc"
          fi
          echo "config=${config}" >> "$GITHUB_OUTPUT"

          if [[ "$count" == "0" ]]; then
            echo "::notice title=markdownlint::No Markdown files to check."
          fi

      - name: Run markdownlint
        if: steps.files.outputs.count != '0'
        continue-on-error: ${{ !inputs.fail-on-error }}
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: ${{ steps.files.outputs.globs }}
          config: ${{ steps.files.outputs.config }}
