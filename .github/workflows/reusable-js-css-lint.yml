##
# Reusable workflow: JavaScript and CSS/SCSS lint through the project's own npm scripts.
#
# Runs `npm run lint:js` and `npm run lint:css` (the @wordpress/scripts
# convention: `wp-scripts lint-js` / `wp-scripts lint-style`) in
# `working-directory`. Scripts the project doesn't define are skipped, so a
# repository opts in by adding them, with its own ESLint/Stylelint config
# (see standards/stylelint for the MDG Stylelint config).
#
# By default lint failures are reported but never fail the build
# (`fail-on-error: true` to enforce).
##
name: JavaScript and CSS lint

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing package.json, relative to the repository root.'
        type: string
        default: '.'
      node-version:
        description: 'Node.js version. Defaults to .nvmrc / .node-version in working-directory, else the current LTS.'
        type: string
        default: ''
      js-script:
        description: 'npm script that lints JavaScript.'
        type: string
        default: 'lint:js'
      css-script:
        description: 'npm script that lints CSS/SCSS.'
        type: string
        default: 'lint:css'
      fail-on-error:
        description: 'Fail the job when a lint script fails. By default failures are reported only.'
        type: boolean
        default: false

permissions: {}

env:
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  lint:
    name: ESLint / Stylelint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Find lint scripts and Node version
        id: detect
        env:
          JS_SCRIPT: ${{ inputs.js-script }}
          CSS_SCRIPT: ${{ inputs.css-script }}
          NODE_VERSION: ${{ inputs.node-version }}
        run: |
          has_script() {
            [[ -f package.json ]] && jq -e --arg s "$1" '.scripts[$s] // empty' package.json > /dev/null
          }
          js=false; css=false
          if has_script "$JS_SCRIPT"; then js=true; fi
          if has_script "$CSS_SCRIPT"; then css=true; fi
          echo "js=${js}" >> "$GITHUB_OUTPUT"
          echo "css=${css}" >> "$GITHUB_OUTPUT"
          if [[ "$js" == "false" && "$css" == "false" ]]; then
            echo "::notice title=JS/CSS lint::No '${JS_SCRIPT}' or '${CSS_SCRIPT}' script in package.json; skipping."
          fi

          version="$NODE_VERSION"
          if [[ -z "$version" && -f .nvmrc ]]; then version="$(tr -d '[:space:]' < .nvmrc)"; fi
          if [[ -z "$version" && -f .node-version ]]; then version="$(tr -d '[:space:]' < .node-version)"; fi
          echo "node-version=${version:-lts/*}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.detect.outputs.js == 'true' || steps.detect.outputs.css == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.detect.outputs.node-version }}

      - name: Install npm dependencies
        if: steps.detect.outputs.js == 'true' || steps.detect.outputs.css == 'true'
        # Install scripts aren't needed for linting and are a supply-chain risk.
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Lint JavaScript
        if: steps.detect.outputs.js == 'true'
        continue-on-error: ${{ !inputs.fail-on-error }}
        env:
          SCRIPT: ${{ inputs.js-script }}
        run: npm run "$SCRIPT"

      - name: Lint CSS
        if: ${{ !cancelled() && steps.detect.outputs.css == 'true' }}
        continue-on-error: ${{ !inputs.fail-on-error }}
        env:
          SCRIPT: ${{ inputs.css-script }}
        run: npm run "$SCRIPT"
